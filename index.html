<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biro Pembangunan dan Lingkungan Hidup - Provinsi DKI Jakarta</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="logo_bplh.jpg">
<style>
:root{--g:#0a9b4a;--g2:#065f46;--o:#ff7a00;--bg:#f4faf6;--card:#fff;--tx:#10261a;--mut:#5b6e63;--line:#dcebe1;--sh:0 10px 30px rgba(6,95,70,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1711;--card:#12241a;--tx:#e8f5ec;--mut:#9db3a5;--line:#21392c;--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1711;--card:#12241a;--tx:#e8f5ec;--mut:#9db3a5;--line:#21392c;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;overflow-x:hidden}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* header */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;line-height:1.15}
.logo img{width:48px;height:48px;border-radius:4px;object-fit:cover;flex:none;box-shadow:0 6px 16px rgba(6,95,70,.25);transition:transform .3s}
.logo:hover img{transform:rotate(-6deg) scale(1.08)}
.logo small{display:block;color:var(--o);font-weight:600;font-size:.82rem}
nav.top{display:flex;gap:4px;align-items:center}
.ni{position:relative}
.nl{background:none;border:0;font:inherit;font-weight:600;padding:10px 16px;border-radius:999px;cursor:pointer;color:var(--tx);transition:.25s}
.nl:hover,.nl.on{background:rgba(10,155,74,.12);color:var(--g)}
.dd{position:absolute;top:100%;left:0;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:8px;opacity:0;visibility:hidden;transform:translateY(10px);transition:.25s}
.ni:hover .dd,.ni:focus-within .dd{opacity:1;visibility:visible;transform:none}
.dd a{display:block;padding:10px 14px;border-radius:12px;font-weight:600;font-size:.93rem}
.dd a:hover{background:rgba(255,122,0,.12);color:var(--o);padding-left:20px}
.dd a{transition:.2s}
/* bottom nav */
#bar{display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--card);border-radius:26px 26px 0 0;padding:18px 18px calc(100px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 50px rgba(0,0,0,.25);transform:translateY(110%);transition:.35s cubic-bezier(.2,.9,.3,1)}
#sheet.open{transform:none}
#sheet h4{margin-bottom:8px}
#sheet a{display:block;padding:13px 14px;border-radius:14px;font-weight:600}
#sheet a:active{background:rgba(10,155,74,.12)}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;opacity:0;visibility:hidden;transition:.3s}
#veil.open{opacity:1;visibility:visible}
@media (max-width:900px){
 nav.top{display:none}
 #bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;box-shadow:0 -8px 24px rgba(0,0,0,.08)}
 #bar button{background:none;border:0;font:inherit;font-size:.78rem;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 10px;cursor:pointer}
 #bar button b{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ff7a00,#ff9a3c);display:grid;place-items:center;font-size:21px;transition:.3s;box-shadow:0 6px 14px rgba(255,122,0,.3)}
 #bar button.on{color:var(--o)}
 #bar button.on b{transform:translateY(-6px) scale(1.08)}
 body{padding-bottom:96px}
}
/* buttons + bubble */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font:inherit;font-weight:700;padding:13px 26px;border-radius:999px;color:#fff;background:linear-gradient(135deg,var(--g),#18c46a);box-shadow:0 8px 20px rgba(10,155,74,.35);transition:transform .25s,box-shadow .25s}
.btn.o{background:linear-gradient(135deg,var(--o),#ff9a3c);box-shadow:0 8px 20px rgba(255,122,0,.35)}
.btn.w{background:var(--card);color:var(--g2);box-shadow:var(--sh)}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn:active{transform:scale(.96)}
.bubble{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.55);transform:scale(0);animation:bub .7s ease-out forwards}
@keyframes bub{to{transform:scale(4);opacity:0}}
.rise{position:absolute;bottom:-8px;border-radius:50%;pointer-events:none;border:1.5px solid rgba(255,255,255,.8);background:rgba(255,255,255,.25);animation:rise 1s ease-out forwards}
@keyframes rise{to{transform:translateY(-46px);opacity:0}}
/* hero */
.hero{position:relative;overflow:hidden;padding:70px 0 90px;background:radial-gradient(circle at 80% 10%,rgba(255,122,0,.16),transparent 40%),radial-gradient(circle at 10% 30%,rgba(10,155,74,.2),transparent 45%)}
.blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.5;animation:float 9s ease-in-out infinite}
.blob.a{width:180px;height:180px;background:rgba(24,196,106,.3);top:40px;right:8%}
.blob.b{width:110px;height:110px;background:rgba(255,122,0,.3);bottom:50px;left:6%;animation-delay:-3s}
@keyframes float{50%{transform:translateY(-28px) translateX(14px)}}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;position:relative}
.chip{display:inline-flex;gap:8px;align-items:center;padding:7px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.88rem;color:var(--g2);box-shadow:var(--sh)}
.chip:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.12;font-weight:800;margin:18px 0}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--o),#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mut);font-size:1.08rem;max-width:560px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.orb{aspect-ratio:1;max-width:420px;margin:auto;border-radius:44% 56% 52% 48%/50% 44% 56% 50%;background:linear-gradient(135deg,var(--g),#7ddc9b 60%,#ffd27a);display:grid;place-items:center;font-size:7rem;animation:morph 8s ease-in-out infinite;box-shadow:0 30px 60px rgba(10,155,74,.3);position:relative;width:100%}
.orb span{animation:float 5s ease-in-out infinite}
.orb u{position:absolute;text-decoration:none;background:var(--card);color:var(--tx);font-size:.85rem;font-weight:700;padding:8px 14px;border-radius:14px;box-shadow:var(--sh);animation:float 6s ease-in-out infinite}
@keyframes morph{50%{border-radius:56% 44% 40% 60%/42% 58% 42% 58%}}
@media (max-width:900px){.hg{grid-template-columns:1fr}.orb{max-width:260px;font-size:4.5rem}}
/* sections */
section{padding:56px 0}
.st{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800;margin-bottom:8px}
.ss{color:var(--mut);margin-bottom:28px;max-width:620px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}

.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid3{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--sh);transition:.3s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(10,155,74,.18);border-color:var(--g)}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,rgba(10,155,74,.16),rgba(255,122,0,.16));margin-bottom:14px}
.card h3{font-size:1.08rem;margin-bottom:6px}
.card p{color:var(--mut);font-size:.94rem}
.tag{display:inline-block;font-size:.76rem;font-weight:700;color:var(--o);background:rgba(255,122,0,.12);padding:3px 12px;border-radius:999px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:-50px;position:relative}
.stat{background:var(--card);border-radius:22px;padding:22px;text-align:center;box-shadow:var(--sh);border:1px solid var(--line)}
.stat b{display:block;font-size:2rem;font-weight:800;color:var(--g)}
.stat span{color:var(--mut);font-size:.88rem}
.band{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border-radius:32px;padding:44px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.band h2{max-width:520px}
.pg{padding:44px 0 24px;background:linear-gradient(135deg,rgba(10,155,74,.14),rgba(255,122,0,.10))}
.crumb{color:var(--mut);font-size:.88rem;font-weight:600}
.pg h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:6px 0 0}
.ul{list-style:none;padding:0;display:grid;gap:12px}
.ul li{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;transition:.25s}
.ul li:hover{transform:translateX(6px);border-color:var(--g)}
.nb{counter-increment:n}
ol.ul{counter-reset:n}
ol.ul li:before{counter-increment:n;content:counter(n);flex:none;width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800}
ol.ul li{justify-content:flex-start}

/* ===== Avatar (inisial & foto) ===== */
.av{position:relative;width:96px;height:96px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,var(--g),#ffb347);display:grid;place-items:center;font-size:2.2rem;color:#fff;font-weight:800;border:4px solid var(--card);box-shadow:0 0 0 3px var(--g)}
/* versi foto: cincin gradasi hijau-oranye + glow lembut */
.av.has-img{
  width:132px;height:132px;padding:0;overflow:visible;
  background:conic-gradient(from 210deg,var(--g),#18c46a,#ffb347,var(--o),var(--g));
  border:0;
  box-shadow:0 14px 32px rgba(10,155,74,.28),0 4px 10px rgba(255,122,0,.18);
  transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s;
}
.av.has-img:before{ /* jarak putih antara cincin dan foto */
  content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card);z-index:0
}
.av.has-img:after{ /* highlight kaca tipis di atas foto */
  content:"";position:absolute;inset:8px;border-radius:50%;z-index:2;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 38%);
}
.av.has-img img{
  position:absolute;inset:8px;z-index:1;
  width:calc(100% - 16px);height:calc(100% - 16px);
  max-width:none;border-radius:50%;object-fit:cover;object-position:center 18%;display:block;
  filter:saturate(1.08) contrast(1.04) brightness(1.03);
  transition:transform .6s cubic-bezier(.2,.8,.2,1);
}
.card:hover .av.has-img{transform:translateY(-3px);box-shadow:0 20px 40px rgba(10,155,74,.36),0 6px 14px rgba(255,122,0,.24)}
.card:hover .av.has-img img{transform:scale(1.06)}
.av.has-img.lg{width:168px;height:168px}
.av.has-img.lg+h3{font-size:1.25rem}
/* kartu pimpinan */
.card.lead-card{background:linear-gradient(180deg,rgba(10,155,74,.08),transparent 55%),var(--card);padding-top:32px}
.card.lead-card p{font-weight:600;color:var(--g2)}
:root[data-theme="dark"] .card.lead-card p{color:var(--g)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card.lead-card p{color:var(--g)}}

.tc{text-align:center}
.node{padding:12px 18px;border-radius:16px;background:var(--card);border:2px solid var(--g);font-weight:700;font-size:.9rem;text-align:center;box-shadow:var(--sh)}
.node.k{background:linear-gradient(135deg,var(--g),#18c46a);color:#fff}
.node.s{border-color:var(--o);font-weight:600;font-size:.82rem}

/* ===== Bagan Struktur Organisasi ===== */
.oc{display:flex;flex-direction:column;align-items:center;width:100%}
.oc-hint{text-align:center;margin:0 auto 24px;max-width:none;display:flex;justify-content:center}
.oc-hint span{display:inline-flex;gap:8px;align-items:center;padding:8px 18px;border-radius:999px;background:rgba(255,122,0,.12);color:var(--o);font-weight:700;font-size:.88rem}
.oc-root{min-width:220px;font-size:1.05rem;padding:14px 32px}
.oc-v{width:2px;height:28px;background:var(--g)}
.oc-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;width:100%;align-items:start}
.oc-col{position:relative;padding-top:28px}
/* garis horizontal penghubung antar kelompok */
.oc-col:before{content:"";position:absolute;top:0;left:-10px;right:-10px;height:2px;background:var(--g)}
.oc-col:first-child:before{left:50%}
.oc-col:last-child:before{right:50%}
/* garis vertikal turun ke kotak ketua kelompok */
.oc-col:after{content:"";position:absolute;top:0;left:50%;width:2px;height:28px;margin-left:-1px;background:var(--g)}
.oc-head{display:flex;align-items:center;justify-content:center;min-height:92px;font-size:.88rem;line-height:1.35}
.oc-subs{list-style:none;padding:0;margin:0 0 0 26px}
.oc-subs li{position:relative;padding:7px 0 7px 22px}
/* garis siku ke setiap subkelompok */
.oc-subs li:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--g)}
.oc-subs li:last-child:before{bottom:50%}
.oc-subs li:after{content:"";position:absolute;left:0;top:50%;width:20px;height:2px;background:var(--g)}
.oc-subs .node{display:flex;align-items:center;justify-content:center;min-height:64px;line-height:1.35}
/* kotak bagan = tombol interaktif */
button.node{font-family:inherit;color:var(--tx);cursor:pointer;width:100%;transition:transform .25s,box-shadow .25s,border-color .25s,background .25s}
button.node.k{color:#fff}
button.node.oc-root{width:auto}
button.node:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(10,155,74,.28);border-color:var(--o)}
button.node.k:hover{border-color:#fff}
button.node.s:hover{border-color:var(--g);background:rgba(10,155,74,.08)}
button.node:active{transform:scale(.97)}
button.node:focus-visible{outline:3px solid var(--o);outline-offset:3px}
@media (max-width:1000px){
 .oc-cols{grid-template-columns:1fr;gap:34px;max-width:480px}
 .oc-col{padding-top:0}
 .oc-col:before{display:none}
 .oc-col:after{display:none}
 .oc-head{min-height:0}
}

/* ===== Pop-up Tugas & Fungsi ===== */
#modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
#modal.open{opacity:1;visibility:visible}
.mbk{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.mdl{position:relative;width:100%;max-width:780px;max-height:min(88vh,100%);display:flex;flex-direction:column;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;transform:translateY(28px) scale(.97);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
#modal.open .mdl{transform:none}
.mh{position:relative;flex:none;padding:24px 28px 18px;background:linear-gradient(135deg,rgba(10,155,74,.16),rgba(255,122,0,.12));border-bottom:1px solid var(--line)}
.mh .tag{margin-bottom:0}
.mh h2{font-size:clamp(1.2rem,3vw,1.6rem);line-height:1.25;font-weight:800;margin:8px 0 8px;padding-right:46px}
.mm{display:grid;gap:3px;color:var(--mut);font-size:.88rem}
.mm b{color:var(--tx);font-weight:700}
.mx{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font:inherit;font-size:1.15rem;font-weight:800;cursor:pointer;box-shadow:var(--sh);transition:.25s}
.mx:hover{background:var(--o);color:#fff;transform:rotate(90deg)}
.mtabs{flex:none;display:flex;gap:8px;padding:14px 28px 0;flex-wrap:wrap}
.mtabs button{font:inherit;font-weight:700;font-size:.9rem;padding:9px 20px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;transition:.25s}
.mtabs button:hover{color:var(--g);border-color:var(--g)}
.mtabs button.on{background:linear-gradient(135deg,var(--g),#18c46a);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(10,155,74,.3)}
.mb{padding:18px 28px 28px;overflow-y:auto;overscroll-behavior:contain}
.mb>p{color:var(--tx);margin-bottom:14px}
.ml{list-style:none;padding:0;display:grid;gap:10px;counter-reset:m}
.ml li{counter-increment:m;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--bg);border:1px solid var(--line);font-size:.93rem;line-height:1.55}
.ml li:before{content:counter(m);flex:none;width:28px;height:28px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8rem;margin-top:1px}
.mk{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.mk h4{font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:10px}
.mk div{display:flex;flex-wrap:wrap;gap:8px}
.mk button{font:inherit;font-weight:600;font-size:.84rem;padding:7px 14px;border-radius:999px;border:0;background:rgba(10,155,74,.12);color:var(--g);cursor:pointer;text-align:left;transition:.25s}
.mk button:hover{background:var(--g);color:#fff;transform:translateY(-2px)}
@media (max-width:640px){
 #modal{padding:0;place-items:end stretch}
 .mdl{max-width:none;max-height:90vh;border-radius:26px 26px 0 0;transform:translateY(100%)}
 .mh{padding:20px 20px 14px}
 .mtabs{padding:12px 20px 0}
 .mb{padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px))}
}

.date{flex:none;width:62px;text-align:center;border-radius:16px;background:linear-gradient(135deg,var(--o),#ff9a3c);color:#fff;padding:8px 0;font-weight:800;line-height:1.1}
.date small{display:block;font-weight:600;font-size:.7rem}
form{display:grid;gap:14px}
input,textarea,select{font:inherit;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--tx);width:100%}
input:focus,textarea:focus{outline:2px solid var(--g)}
.map{border-radius:24px;min-height:300px;background:linear-gradient(135deg,#cfeedd,#e8f7ee);position:relative;overflow:hidden;display:grid;place-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(10,155,74,.12) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(10,155,74,.12) 39px 40px)}
.pin{font-size:3rem;animation:bounce 1.4s infinite;position:relative}
@keyframes bounce{50%{transform:translateY(-14px)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.soc a{padding:8px 16px;border-radius:999px;background:rgba(10,155,74,.12);font-weight:700;font-size:.88rem;transition:.25s}
.soc a:hover{background:var(--g);color:#fff;transform:translateY(-3px)}
footer{padding:36px 0 24px;border-top:1px solid var(--line);color:var(--mut);font-size:.9rem;text-align:center}
.rv{opacity:0;transform:translateY(28px);transition:.7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
#toast{position:fixed;left:50%;top:90px;transform:translate(-50%,-30px);background:var(--g2);color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;opacity:0;transition:.4s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* ===== Tentang Kami ===== */
.ab{display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center}
.ph{position:relative}
.ph:before{content:"";position:absolute;inset:18px -18px -18px 18px;border-radius:34px;background:linear-gradient(135deg,#0b2a6b,#38bdf8);z-index:0;transition:.4s;box-shadow:0 18px 40px rgba(11,42,107,.28)}
.ph:hover:before{inset:10px -10px -10px 10px}
.ph .fr{position:relative;z-index:1;border-radius:32px;overflow:hidden;aspect-ratio:4/3;border:6px solid var(--card);box-shadow:var(--sh)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.ph:hover img{transform:scale(1.07)}
.fb{position:absolute;z-index:2;left:-16px;bottom:30px;background:var(--card);padding:8px 12px;border-radius:18px;box-shadow:var(--sh);font-weight:800;font-size:.92rem;display:flex;gap:12px;align-items:center;animation:float 6s ease-in-out infinite}
.fb small{display:block;font-weight:600;color:var(--mut);font-size:.76rem}
.fb i{font-style:normal;font-size:1.7rem}
.ab p{color:var(--mut);margin-bottom:14px}
.ab .st{line-height:1.2;margin:10px 0 16px}
.ab .st b{color:var(--o)}
.sc h3{display:flex;align-items:center;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips span{padding:5px 13px;border-radius:999px;background:rgba(10,155,74,.12);color:var(--g);font-weight:600;font-size:.8rem;transition:.25s;cursor:default}
.chips span:hover{background:var(--g);color:#fff;transform:translateY(-3px)}
@media (max-width:900px){
 .ab{grid-template-columns:1fr;gap:40px}
 .ph:before{inset:12px -8px -12px 8px}
 .fb{left:10px;bottom:18px}
}

/* ===== Layanan Cepat (beranda) ===== */
.lc{display:grid;grid-template-columns:1fr 1.7fr;gap:20px;align-items:stretch}
.lc-p{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--sh)}
.lc-p.ext{background:linear-gradient(160deg,rgba(255,122,0,.10),transparent 60%),var(--card)}
.lc-p.int{background:linear-gradient(160deg,rgba(10,155,74,.10),transparent 60%),var(--card)}
.lc-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.lc-h h3{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:800}
.lc-h h3:before{content:"";width:12px;height:12px;border-radius:4px;background:var(--g)}
.lc-p.ext .lc-h h3:before{background:var(--o)}
.lc-h small{color:var(--mut);font-weight:600;font-size:.82rem}
.lc-g{display:grid;gap:10px}
.lc-p.int .lc-g{grid-template-columns:repeat(2,minmax(0,1fr))}
.lc-t{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;background:var(--bg);border:1px solid var(--line);transition:border-color .25s,transform .25s,box-shadow .25s}
.lc-t:hover{transform:translateY(-3px);border-color:var(--g);box-shadow:0 12px 26px rgba(10,155,74,.16)}
.lc-p.ext .lc-t:hover{border-color:var(--o);box-shadow:0 12px 26px rgba(255,122,0,.18)}
.lc-t:focus-visible{outline:3px solid var(--o);outline-offset:3px}
.lc-i{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:background .25s}
.lc-t:hover .lc-i{background:linear-gradient(135deg,rgba(10,155,74,.22),rgba(255,122,0,.22))}
.lc-x{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.lc-x b{font-size:.96rem;font-weight:800}
.lc-x small{color:var(--mut);font-size:.8rem;font-weight:500}
.lc-a{flex:none;color:var(--mut);font-weight:800;transition:transform .25s,color .25s}
.lc-t:hover .lc-a{color:var(--g);transform:translate(2px,-2px)}
.lc-p.ext .lc-t:hover .lc-a{color:var(--o)}
.lc-more{margin-top:22px}
@media (max-width:900px){.lc{grid-template-columns:1fr}}
@media (max-width:560px){.lc-p{padding:18px}.lc-p.int .lc-g{grid-template-columns:1fr}}

/* ===== Footer (gaya JIKA) ===== */
footer.ft{padding:0;border-top:0;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;text-align:center;font-size:1rem}
.ft-in{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:56px 20px}
.ft-brand,.ft-info{display:flex;flex-direction:column;align-items:center;gap:14px}
.ft-brand img{height:96px;width:auto;object-fit:contain}
.ft-brand p{font-size:1.35rem;font-weight:600;line-height:1.35}
.ft-info h4{font-size:1.1rem;font-weight:600}
.ft-soc{display:flex;gap:20px;align-items:center;justify-content:center;margin:2px 0}
.ft-soc a{color:#fff;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;transition:background .25s,transform .25s}
.ft-soc a:hover{background:rgba(255,255,255,.18);transform:translateY(-3px)}
.ft-soc svg{width:26px;height:26px}
.ft-jaki{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:8px 18px;border-radius:999px;transition:background .25s}
.ft-jaki:hover{background:rgba(255,255,255,.16)}
.ft-jaki svg{width:22px;height:22px}
.ft-copy{font-size:.98rem;line-height:1.6}
.ft-copy p+p{margin-top:6px}
.ft a:focus-visible{outline:3px solid #fff;outline-offset:3px}
#up{position:fixed;right:20px;bottom:24px;z-index:85;width:48px;height:48px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--o),#ff9a3c);color:#fff;font:inherit;font-size:1.3rem;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(255,122,0,.4);opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .3s,visibility .3s,transform .3s}
#up.show{opacity:1;visibility:visible;transform:none}
@media (max-width:760px){
 .ft-in{grid-template-columns:1fr;gap:32px;padding:40px 20px}
 .ft-brand img{height:80px}
 #up{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
}

<div id="veil"></div><div id="sheet"></div><div id="bar"></div><div id="toast"></div>
<div id="modal" aria-hidden="true"><div class="mbk" data-close></div><div class="mdl" role="dialog" aria-modal="true" aria-labelledby="mt"></div></div>
<script>
const M=[
{t:'Beranda',i:'🏠',h:'/'},
{t:'Profil',i:'🏢',
    s:[['tentang','Tentang Kami'],['jabatan','Profil Jabatan'],['struktur','Struktur Organisasi'],['visi','Visi & Misi'],['tugas','Tugas & Fungsi'],['regulasi','Kebijakan & Regulasi'],['kontak','Kontak Kami']]},
{t:'Informasi',i:'📰',
    s:[['berita','Berita'],['pengaduan','Pengaduan'],['laporan','Laporan'],['pengumuman','Pengumuman'],['agenda','Kalender Agenda'],['ppid','PPID']]},
{t:'Layanan',i:'🎧',
    s:[['layanan','Layanan Internal'],['layanan','Layanan Eksternal']]}
];
const $=s=>document.querySelector(s);
const sub=m=>m.s.map(x=>`<a href="#/${x[0]}${x[1].includes('Eksternal')?'/ext':''}">${x[1]}</a>`).join('');
$('#top').innerHTML=M.map((m,k)=>m.s?`<div class="ni"><button class="nl" data-k="${k}">${m.t} ▾</button><div class="dd">${sub(m)}</div></div>`:`<a class="nl" data-k="${k}" href="#${m.h}">${m.t}</a>`).join('');
$('#bar').innerHTML=M.map((m,k)=>`<button data-k="${k}"><b>${m.i}</b>${m.t}</button>`).join('');
function closeS(){$('#sheet').classList.remove('open');$('#veil').classList.remove('open')}
$('#veil').onclick=closeS;$('#sheet').onclick=e=>{if(e.target.closest('a'))closeS()};
$('#bar').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=M[b.dataset.k];if(!m.s){closeS();location.hash=m.h;return}
 $('#sheet').innerHTML=`<h4>${m.t}</h4>`+sub(m);$('#sheet').classList.add('open');$('#veil').classList.add('open')};
// bubble effect
function bubbles(el,x,y){const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)/3,b=document.createElement('span');b.className='bubble';b.style.cssText=`width:${d}px;height:${d}px;left:${x-r.left-d/2}px;top:${y-r.top-d/2}px`;el.appendChild(b);setTimeout(()=>b.remove(),700)}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn');if(b)bubbles(b,e.clientX,e.clientY)});
document.addEventListener('pointerover',e=>{const b=e.target.closest('.btn');if(!b||b.contains(e.relatedTarget))return;for(let i=0;i<5;i++){const s=document.createElement('span'),d=6+Math.random()*10;s.className='rise';s.style.cssText=`width:${d}px;height:${d}px;left:${10+Math.random()*80}%;animation-delay:${i*.08}s`;b.appendChild(s);setTimeout(()=>s.remove(),1200)}});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
// jika foto gagal dimuat, kembali ke avatar inisial
function imgFail(img){const av=img.parentElement;av.classList.remove('has-img','lg');av.textContent=img.alt?img.alt[0]:'?'}
// helpers
const hd=(c,t)=>`<div class="pg"><div class="wrap"><div class="crumb">${c}</div><h1>${t}</h1></div></div>`;
const W=h=>`<section><div class="wrap">${h}</div></section>`;
const cards=a=>`<div class="grid">${a.map(c=>`<div class="card rv"><div class="ic">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join('')}</div>`;
const ol=a=>`<ol class="ul">${a.map(x=>`<li class="rv">${x}</li>`).join('')}</ol>`;
const news=[['Kolaborasi','Rapat Koordinasi Program Pengelolaan Lingkungan Hidup 2026','12 Okt 2026'],['Pembangunan','Monitoring Capaian Pembangunan Triwulan III','08 Okt 2026'],['Lingkungan','Kampanye Jakarta Bersih dan Hijau Bersama Perangkat Daerah','01 Okt 2026']];

// ===== Data Layanan Cepat (samakan dengan halaman Layanan) =====
const LC_EXT=[
 ['📚','JIKA','Platform pengetahuan dan kecerdasan kebijakan Jakarta','https://jika.jakarta.go.id'],
 ['📊','SIMONERO','Monitoring progres pekerjaan dan realisasi anggaran','https://jakartasatu.jakarta.go.id/emonev_plh/login'],
 ['🏛️','CRM','Pelaporan masyarakat kepada Gubernur','https://crm.jakarta.go.id/petugas/login']
];
const LC_INT=[
 ['📈','SIMPELMON','Monitoring dan evaluasi program Setda','https://simpelmon.jakarta.go.id/'],
 ['🗓️','Absen Rabu Transum','Presensi kegiatan Rabu Transum','https://sirabutransumbiroplh.blogspot.com/?m=0'],
 ['🗂️','SIPABRO PLH','Peminjaman arsip Biro PLH','https://sipabroplh.blogspot.com/?m=0'],
 ['🏢','TP3W','SIPPT/IPPT/IPPR dan tata ruang','https://tp3wbiroplh.blogspot.com/?m=0'],
 ['♻️','PILAH SAMPAH','Laporan pemilahan sampah Biro PLH','https://pilahsampahbiroplh.blogspot.com/?m=0'],
 ['💻','MANAJEMEN ZOOM','Monitoring jadwal Zoom','https://manajemenzoombiroplh.blogspot.com/?m=0']
];
const lcTile=l=>`<a class="lc-t" href="${l[3]}" target="_blank" rel="noopener"><span class="lc-i">${l[0]}</span><span class="lc-x"><b>${l[1]}</b><small>${l[2]}</small></span><span class="lc-a">↗</span></a>`;

// ===== Berita Terbaru beranda (cadangan; ditimpa oleh script Berita di bawah) =====
window.homeNews=function(){return `<div class="grid">${news.map(n=>`<div class="card rv"><span class="tag">${n[0]}</span><h3>${n[1]}</h3><p>${n[2]}</p></div>`).join('')}</div>`};

/* ================= DATA TUGAS & FUNGSI (STRUKTUR ORGANISASI) ================= */
const KB='Kepala Biro Pembangunan dan Lingkungan Hidup';
const BIRO='Biro Pembangunan dan Lingkungan Hidup';
const JF_MADYA='Analis Kebijakan Ahli Madya';
const JF_MUDA='Analis Kebijakan Ahli Muda';
const ORG={};

// Kelompok: tS = lingkup tugas, fS = lingkup fungsi
function addKel(id,nama,tS,fS,children){
 ORG[id]={lv:'Kelompok',t:'Kelompok '+nama,nama,pimp:'Ketua Kelompok '+nama,atasan:KB,jf:JF_MADYA,parent:null,children,
  tabs:[
   {l:'Tugas',p:`Kelompok ${nama} mempunyai tugas melaksanakan pengoordinasian dan perumusan kebijakan, pemantauan dan evaluasi pelaksanaan kebijakan, dan pengoordinasian pelaksanaan tugas PD penyelenggaraan urusan pemerintahan bidang ${tS}.`},
   {l:'Fungsi',p:`Kelompok ${nama} menyelenggarakan fungsi:`,items:[
     `pengoordinasian, perumusan dan penyusunan kebijakan penyelenggaraan urusan pemerintahan bidang ${fS}`,
     `pemantauan dan evaluasi pelaksanaan kebijakan penyelenggaraan urusan pemerintahan bidang ${fS}`,
     `pengoordinasian pelaksanaan tugas PD dalam penyelenggaraan urusan pemerintahan bidang ${fS}`,
     `pelaksanaan pengelolaan data dan informasi kebijakan penyelenggaraan urusan pemerintahan bidang ${fS}`]}
  ]};
}
// Subkelompok: S = lingkup; d = true jika redaksinya "dalam ..."
function addSub(id,nama,parent,S,d){
 const dl=d?'dalam ':'';
 ORG[id]={lv:'Subkelompok',t:'Subkelompok '+nama,nama,pimp:'Ketua Subkelompok '+nama,atasan:'Ketua '+ORG[parent].t,jf:JF_MUDA,parent,
  tabs:[{l:'Tugas',p:`Subkelompok ${nama} mempunyai tugas:`,items:[
   `mengoordinasikan, merumuskan dan menyusun kebijakan ${dl}${S}`,
   `memantau dan mengevaluasi pelaksanaan kebijakan ${dl}${S}`,
   `mengoordinasikan pelaksanaan tugas PD dalam ${S}`,
   d?`mengelola data dan informasi dalam ${S}`:`mengelola data dan informasi kebijakan ${S}`]}]};
}

addKel('pupr','Pekerjaan Umum dan Perumahan Rakyat',
 'pekerjaan umum dan penataan ruang (pada sub urusan bidang jalan, sumber daya air, air minum, air limbah, drainase, permukiman), perumahan rakyat dan kawasan permukiman, energi dan sumber daya mineral (pada sub urusan bidang geologi), dan penyelenggaraan penerangan jalan umum, jaringan utilitas dan infrastruktur transportasi',
 'pekerjaan umum dan penataan ruang (pada sub urusan bidang jalan, sumber daya air, air minum, air limbah, drainase, permukiman), perumahan rakyat dan kawasan permukiman, energi dan sumber daya mineral (pada sub urusan bidang geologi), dan penyelenggaraan penerangan jalan umum, jaringan utilitas dan infrastruktur transportasi',
 ['bm','sda','prkp']);
addKel('prcp','Penataan Ruang, Cipta Karya dan Pertanahan',
 'pekerjaan umum dan penataan ruang (pada sub urusan bidang penataan ruang, bangunan gedung, penataan bangunan dan lingkungannya, dan permukiman), perumahan rakyat dan kawasan permukiman, pertanahan, dan penyelenggaraan penataan kawasan',
 'pekerjaan umum dan penataan ruang (pada sub urusan bidang penataan ruang, bangunan gedung, penataan bangunan dan lingkungannya, permukiman, dan jasa konstruksi), perumahan rakyat dan kawasan permukiman, dan pertanahan',
 ['bg','prp','pr']);
addKel('lhrth','Lingkungan Hidup dan Ruang Terbuka Hijau',
 'pekerjaan umum dan penataan ruang (pada sub urusan bidang persampahan dan air limbah), lingkungan hidup, kehutanan dan penyelenggaraan pertamanan dan pemakaman, dan bidang mitigasi adaptasi bencana iklim',
 'pekerjaan umum dan penataan ruang (pada sub urusan bidang persampahan dan air limbah), lingkungan hidup, kehutanan dan penyelenggaraan pertamanan dan pemakaman, dan bidang mitigasi adaptasi bencana iklim',
 ['kb','lh','rth']);

// Kelompok Pembangunan Kota (redaksi berbeda, ditulis manual)
(()=>{
 const X='pemantauan program pembangunan, pemantauan fasilitas sosial dan fasilitas umum, dan penyelesaian pemenuhan kewajiban Izin Pemanfaatan Ruang';
 ORG.pk={lv:'Kelompok',t:'Kelompok Pembangunan Kota',nama:'Pembangunan Kota',pimp:'Ketua Kelompok Pembangunan Kota',atasan:KB,jf:JF_MADYA,parent:null,children:['tu','ppp','ppk'],
  tabs:[
   {l:'Tugas',p:`Kelompok Pembangunan Kota mempunyai tugas melaksanakan pengoordinasian dan perumusan kebijakan, pemantauan dan evaluasi pelaksanaan kebijakan, dan pengoordinasian pelaksanaan tugas PD dalam pemantauan program pembangunan, pemantauan fasilitas sosial dan fasilitas umum, penyelesaian pemenuhan kewajiban Izin Pemanfaatan Ruang, serta pengelolaan kesekretariatan ${BIRO}.`},
   {l:'Fungsi',p:'Dalam melaksanakan tugas, Kelompok Pembangunan Kota menyelenggarakan fungsi:',items:[
    `pengoordinasian, perumusan dan penyusunan kebijakan dalam ${X}`,
    `pemantauan dan evaluasi pelaksanaan kebijakan dalam ${X}`,
    `pengoordinasian pelaksanaan tugas PD dalam ${X}`,
    `pelaksanaan pengelolaan data dan informasi kebijakan dalam ${X}`,
    `pengelolaan kesekretariatan ${BIRO}`]}
  ]};
})();

// Subkelompok
addSub('bm','Bina Marga dan Infrastruktur Transportasi','pupr','penyelenggaraan urusan pemerintahan bidang pekerjaan umum dan penataan ruang (pada sub urusan bidang jalan), penyelenggaraan penerangan jalan umum, jaringan utilitas dan infrastruktur transportasi (prasarana dan sarana transportasi darat dan transportasi laut)');

let curOrg=null,curTab=0,lastFocus=null;
function renderM(){
 const d=ORG[curOrg],tab=d.tabs[curTab];
 const meta=[`Dipimpin oleh <b>${d.pimp}</b>`];
 /*
 if(d.atasan)meta.push(`Berkedudukan di bawah dan bertanggung jawab kepada <b>${d.atasan}</b>`);
 if(d.jf)meta.push(`Kelompok Jabatan Fungsional: <b>${d.jf}</b>`);
 */
 const chips=(t,a)=>a&&a.length?`<div class="mk"><h4>${t}</h4><div>${a.map(i=>`<button type="button" data-org="${i}">${ORG[i].t}</button>`).join('')}</div></div>`:'';
 const nav=chips(d.lv==='Kelompok'?'Subkelompok / unit di bawahnya':'Unit di bawahnya',d.children)+(d.parent?chips('Atasan langsung',[d.parent]):'');
 $('#modal .mdl').innerHTML=
 `<div class="mh"><button class="mx" type="button" data-close aria-label="Tutup">✕</button>
   <span class="tag">${d.lv}</span><h2 id="mt">${d.t}</h2><div class="mm">${meta.map(m=>`<span>${m}</span>`).join('')}</div></div>`
 +(d.tabs.length>1?`<div class="mtabs" role="tablist">${d.tabs.map((x,i)=>`<button type="button" role="tab" aria-selected="${i===curTab}" class="${i===curTab?'on':''}" data-tab="${i}">${x.l}</button>`).join('')}</div>`:'')
 +`<div class="mb">${tab.p?`<p>${tab.p}</p>`:''}${tab.items?`<ol class="ml">${tab.items.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}${nav}</div>`;
}
function openOrg(id){
 if(!ORG[id])return;
 const m=$('#modal');
 if(!m.classList.contains('open'))lastFocus=document.activeElement;
 curOrg=id;curTab=0;renderM();
 m.classList.add('open');m.setAttribute('aria-hidden','false');document.body.classList.add('lock');
 const mb=$('#modal .mb');if(mb)mb.scrollTop=0;
 const x=$('#modal .mx');if(x)x.focus({preventScroll:true});
}
function closeM(){
 const m=$('#modal');if(!m.classList.contains('open'))return;
 m.classList.remove('open');m.setAttribute('aria-hidden','true');document.body.classList.remove('lock');
 if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
}
document.addEventListener('click',e=>{
 const o=e.target.closest('[data-org]');if(o){openOrg(o.dataset.org);return}
 const t=e.target.closest('[data-tab]');if(t&&curOrg){curTab=+t.dataset.tab;renderM();const x=$('#modal .mtabs .on');if(x)x.focus({preventScroll:true});return}
 if(e.target.closest('[data-close]'))closeM();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

      if (st.sel) evs = evs.filter(function (e) { return e.d === st.sel; });
      var t = st.sel ? (function () { var p = st.sel.split('-'); return HARI[new Date(+p[0], +p[1] - 1, +p[2]).getDay()] + ', ' + (+p[2]) + ' ' + BULAN[st.m] + ' ' + st.y; })() : 'Agenda ' + BULAN[st.m] + ' ' + st.y;
      var head = '<div class="ag-head"><div><h3>' + t + '</h3><p>' + evs.length + ' kegiatan terjadwal</p></div>' +
        (st.sel ? '<button type="button" class="ag-clear" data-agc="1">Tampilkan semua bulan ini</button>' : '') + '</div>';
      if (!evs.length) return head + '<div class="ag-empty"><b>🗓️</b>Belum ada agenda kegiatan pada bulan ini.</div>';
      return head + '<div class="ag-list">' + evs.map(function (e) {
        var p = e.d.split('-'), past = e.d < TODAY, now = e.d === TODAY;
        return '<div class="ag-item' + (past ? ' past' : '') + '"><div class="ag-date"><b>' + (+p[2]) + '</b><small>' + BULAN[+p[1] - 1].slice(0, 3) + '</small></div>' +
          '<div class="ag-info"><h4>' + esc(e.t) + '</h4><div class="ag-meta"><span>🕘 ' + esc(e.w) + '</span><span class="c">' + esc(e.c) + '</span>' +
          '<span class="s' + (now ? ' now' : '') + '">' + (now ? 'Hari ini' : past ? 'Selesai' : 'Akan datang') + '</span></div></div>' +
          '<div class="ag-ic">' + e.i + '</div></div>';
      }).join('') + '</div>';
    }
  
    function render() {
      var root = document.getElementById('ag-root');
      if (!root) return;
      root.innerHTML =
        '<div class="ag-cal"><div class="ag-ch"><div><h3>' + BULAN[st.m] + ' ' + st.y + '</h3><small>' + monthEvents().length + ' agenda bulan ini</small></div>' +
        '<div class="ag-nav"><button type="button" data-agn="-1" aria-label="Bulan sebelumnya">‹</button><button type="button" data-agn="0">Hari ini</button><button type="button" data-agn="1" aria-label="Bulan berikutnya">›</button></div></div>' +
        '<div class="ag-grid">' + calHTML() + '</div>' +
        '<div class="ag-leg"><span><i style="background:rgba(255,122,0,.35)"></i>Ada agenda</span><span><i style="box-shadow:inset 0 0 0 2px var(--g)"></i>Hari ini</span><span><i style="background:linear-gradient(135deg,var(--o),#ff9a3c)"></i>Dipilih</span></div></div>' +
        '<div class="ag-side">' + listHTML() + '</div>';
    }
  
    var agendaPage = function () {
      st.y = now.getFullYear(); st.m = now.getMonth(); st.sel = null;
      return hd('Informasi', 'Kalender Agenda') +
        W('<p class="ss">Jadwal kegiatan Biro Pembangunan dan Lingkungan Hidup. Klik tanggal berwarna orange untuk melihat agendanya.</p><div class="ag-wrap" id="ag-root"></div>');
    };
  
    document.addEventListener('click', function (e) {
      var n = e.target.closest && e.target.closest('[data-agn]');
      if (n) {
        var v = +n.dataset.agn;
        if (v === 0) { st.y = now.getFullYear(); st.m = now.getMonth(); }
        else { st.m += v; if (st.m < 0) { st.m = 11; st.y--; } if (st.m > 11) { st.m = 0; st.y++; } }
        st.sel = null; render(); return;
      }
      var d = e.target.closest && e.target.closest('[data-agd]');
      if (d) { st.sel = st.sel === d.dataset.agd ? null : d.dataset.agd; render(); return; }
      if (e.target.closest && e.target.closest('[data-agc]')) { st.sel = null; render(); }
    });
  
    // render isi setelah router menaruh halaman ke #main
    function mount() {
      P.agenda = function () { return agendaPage(); };
      if (/agenda/.test(location.hash)) route();
    }
    var _route = window.route;
    window.addEventListener('hashchange', function () { setTimeout(render, 0); });
    var obs = new MutationObserver(function () { if (document.getElementById('ag-root') && !document.querySelector('#ag-root .ag-cal')) render(); });
    obs.observe(document.getElementById('main'), { childList: true });
    try { P; mount(); }
    catch (e) { document.addEventListener('DOMContentLoaded', mount); }
  })();
  </script>

</body>
</html>
